[project]
name = "mcp-jama"
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.7.0",
    "py-jama-rest-client>=1.16.0",
]

[project.scripts]
mcp-jama = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "server.py", "config.py"]
