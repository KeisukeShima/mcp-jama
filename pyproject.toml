[project]
name = "mcp-jama"
version = "0.1.5"
readme = "README.md"
urls = { "Source" = "https://github.com/KeisukeShima/mcp-jama" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.7.0,<2",
    "py-jama-rest-client>=1.16.0",
]

[project.scripts]
mcp-jama = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "server.py", "config.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/tools",
    "/tests",
    "/config.py",
    "/server.py",
    "/config.json.example",
    "/requirements.txt",
    "/README.md",
    "/pyproject.toml",
]
